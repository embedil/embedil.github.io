<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>SimulCar BLE Controller</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #0a0a0c;
        --panel: #121216;
        --border: #2a2a30;
        --text: #eaeaea;
        --muted: #8a8a92;
        --accent: #2ea8ff;
        --brake: #ff3b3b;
        --brake-dark: #5c1414;
        --throttle: #2ecc71;
        --throttle-dark: #114d2a;
        --danger: #ff3b3b;
        --ok: #2ecc71;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #app {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }

      /* TOP BAR */
      #topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        z-index: 10;
      }
      #topbar .title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--accent);
        white-space: nowrap;
        text-decoration: none;
        cursor: pointer;
        touch-action: manipulation;
      }
      #topbar .title:active {
        filter: brightness(0.75);
      }
      #topbar .title:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }
      #statusWrap {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      #statusDot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 6px var(--danger);
        flex: 0 0 auto;
      }
      #statusDot.connected {
        background: var(--ok);
        box-shadow: 0 0 6px var(--ok);
      }
      #connectBtn {
        background: var(--accent);
        color: #07131c;
        border: none;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 700;
        border-radius: 8px;
        cursor: pointer;
        touch-action: manipulation;
      }
      #connectBtn:active {
        filter: brightness(0.85);
      }
      #connectBtn.disconnect {
        background: var(--brake);
        color: #1a0505;
      }
      #connectBtn:disabled {
        background: #3a3a40;
        color: #888;
      }
      #debugToggleWrap {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        cursor: pointer;
      }
      /* Custom toggle switch (native checkbox hidden, keeps :checked state) */
      #debugToggleWrap input[type="checkbox"] {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }
      .toggle-track {
        position: relative;
        display: inline-block;
        flex: 0 0 auto;
        width: 34px;
        height: 18px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 9px;
        transition:
          background 0.2s ease,
          border-color 0.2s ease;
      }
      .toggle-track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--muted);
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }
      #debugToggleWrap input:checked + .toggle-track {
        background: var(--accent);
        border-color: var(--accent);
      }
      #debugToggleWrap input:checked + .toggle-track::after {
        background: #07131c;
        transform: translateX(16px);
      }
      #debugToggleWrap input:focus-visible + .toggle-track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* MAIN LAYOUT */
      #main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: row;
        min-height: 0;
        padding: 10px;
        gap: 10px;
      }

      /* PEDAL PANELS */
      .pedal-panel {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        min-width: 0;
      }
      .pedal-label-top {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .pedal-track {
        position: relative;
        flex: 1 1 auto;
        width: 64px;
        max-width: 22vw;
        min-width: 46px;
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        touch-action: none;
      }
      .pedal-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        border-radius: 0;
      }
      #brakeTrack .pedal-fill {
        background: linear-gradient(to top, var(--brake-dark), var(--brake));
      }
      #throttleTrack .pedal-fill {
        background: linear-gradient(
          to top,
          var(--throttle-dark),
          var(--throttle)
        );
      }
      .pedal-ticks {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 6px 0;
        pointer-events: none;
      }
      .pedal-ticks div {
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
        width: 100%;
      }
      .pedal-value {
        margin-top: 8px;
        font-size: 22px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        min-width: 3ch;
        text-align: center;
      }
      #brakePercent {
        color: var(--brake);
      }
      #throttlePercent {
        color: var(--throttle);
      }
      .pedal-sub {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 1px;
      }

      /* RIGHT SIDE WRAPPER (brake + throttle, both under the right hand) */
      #pedalsPanel {
        flex: 1 1 0;
        display: flex;
        flex-direction: row;
        min-width: 0;
        gap: 10px;
        height: 100%;
      }
      #pedalsPanel .pedal-panel {
        flex: 1 1 0;
      }

      /* STEERING WHEEL PANEL (LEFT, left hand) */
      .wheel-panel {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        min-width: 0;
        height: 100%;
      }
      .wheel-track {
        position: relative;
        flex: 1 1 auto;
        width: 100%;
        max-width: min(100%, 46vh, 320px);
        aspect-ratio: 1 / 1;
        margin: auto;
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: 50%;
        overflow: hidden;
        touch-action: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wheel-track svg {
        width: 78%;
        height: 78%;
        transition: none;
        will-change: transform;
      }
      .wheel-panel.disabled .wheel-track {
        opacity: 0.35;
      }
      #steeringPercent {
        color: var(--accent);
      }

      /* CENTER PANEL */
      #centerPanel {
        flex: 0 0 auto;
        width: 40%;
        max-width: 420px;
        min-width: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      #speedGauge {
        width: min(85%, 46vh, 360px);
        aspect-ratio: 1 / 1;
        margin: auto;
        overflow: visible;
      }
      #needleGroup {
        transition: none;
      }
      #needleGroup line {
        filter: drop-shadow(0 0 4px rgba(46, 168, 255, 0.55));
      }
      #speedDigital {
        font-variant-numeric: tabular-nums;
      }
      .gauge-tick {
        stroke: var(--muted);
      }
      .gauge-tick.major {
        stroke: var(--text);
      }
      .gauge-label {
        fill: var(--muted);
        font-size: 9px;
        text-anchor: middle;
        font-variant-numeric: tabular-nums;
      }
      #telemetry {
        display: flex;
        gap: 18px;
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      #telemetry span b {
        display: block;
        font-size: 15px;
        color: var(--text);
      }

      .pedal-panel.disabled .pedal-track {
        opacity: 0.35;
      }

      /* PORTRAIT BLOCKER: full-screen overlay that hides the app until
         the phone is held horizontally. Cannot be dismissed. */
      #rotateOverlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--bg);
        color: var(--text);
        text-align: center;
        padding: 30px;
        font-size: 16px;
        line-height: 1.5;
      }
      #rotateOverlay .rotate-icon {
        color: var(--accent);
        animation: rotateHint 2.2s ease-in-out infinite;
      }
      @keyframes rotateHint {
        0%,
        20% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(90deg);
        }
      }
      @media (orientation: portrait) {
        #rotateOverlay {
          display: flex;
        }
      }

      #unsupportedMsg {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        color: #fff;
        z-index: 999;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <a class="title" href="/simulcar/">SimulCar</a>
        <div id="statusWrap">
          <div id="statusDot"></div>
          <span id="statusText">Disconnected</span>
        </div>
        <label id="debugToggleWrap">
          <input type="checkbox" id="debugScan" />
          <span class="toggle-track"></span>
          <span>Show all devices</span>
        </label>
        <button id="connectBtn">Connect SimulCar</button>
      </div>

      <div id="main">
        <!-- STEERING WHEEL (LEFT, left hand) -->
        <div class="wheel-panel disabled" id="steeringPanel">
          <div class="pedal-label-top">STEERING</div>
          <div class="wheel-track" id="steeringTrack">
            <svg
              id="steeringWheelGraphic"
              viewBox="0 0 120 120"
              style="color: var(--accent)"
            >
              <circle
                cx="60"
                cy="60"
                r="52"
                fill="none"
                stroke="currentColor"
                stroke-width="8"
              />
              <circle cx="60" cy="60" r="9" fill="currentColor" />
              <line
                x1="60"
                y1="60"
                x2="60"
                y2="16"
                stroke="currentColor"
                stroke-width="8"
                stroke-linecap="round"
              />
              <line
                x1="60"
                y1="60"
                x2="24"
                y2="80"
                stroke="currentColor"
                stroke-width="8"
                stroke-linecap="round"
              />
              <line
                x1="60"
                y1="60"
                x2="96"
                y2="80"
                stroke="currentColor"
                stroke-width="8"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="pedal-value"><span id="steeringPercent">0</span>%</div>
          <div class="pedal-sub">ROTATE</div>
        </div>

        <!-- CENTER -->
        <div id="centerPanel">
          <svg id="speedGauge" viewBox="0 0 200 200">
            <g id="gaugeTicks"></g>
            <path
              id="gaugeTrack"
              fill="none"
              stroke="var(--border)"
              stroke-width="10"
              stroke-linecap="round"
            />
            <path
              id="gaugeRedline"
              fill="none"
              stroke="var(--brake)"
              stroke-width="10"
              stroke-linecap="round"
            />
            <g id="needleGroup">
              <line
                x1="100"
                y1="100"
                x2="100"
                y2="34"
                stroke="var(--accent)"
                stroke-width="4"
                stroke-linecap="round"
              />
            </g>
            <circle
              cx="100"
              cy="100"
              r="9"
              fill="var(--panel)"
              stroke="var(--border)"
              stroke-width="2"
            />
            <text
              id="speedDigital"
              x="100"
              y="149"
              text-anchor="middle"
              font-size="26"
              font-weight="800"
              fill="var(--text)"
            >
              0
            </text>
            <text
              x="100"
              y="165"
              text-anchor="middle"
              font-size="9"
              letter-spacing="2"
              fill="var(--muted)"
            >
              KM/H
            </text>
          </svg>
          <div id="telemetry">
            <span>THR<b id="telemThrottle">0%</b></span>
            <span>BRK<b id="telemBrake">0%</b></span>
            <span>STR<b id="telemSteering">0%</b></span>
          </div>
        </div>

        <!-- BRAKE + THROTTLE (RIGHT, right hand) -->
        <div id="pedalsPanel">
          <div class="pedal-panel disabled" id="brakePanel">
            <div class="pedal-label-top">BRAKE</div>
            <div class="pedal-track" id="brakeTrack">
              <div class="pedal-ticks">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
              </div>
              <div class="pedal-fill" id="brakeFill"></div>
            </div>
            <div class="pedal-value"><span id="brakePercent">0</span>%</div>
            <div class="pedal-sub">HOLD &amp; DRAG</div>
          </div>

          <div class="pedal-panel disabled" id="throttlePanel">
            <div class="pedal-label-top">THROTTLE</div>
            <div class="pedal-track" id="throttleTrack">
              <div class="pedal-ticks">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
              </div>
              <div class="pedal-fill" id="throttleFill"></div>
            </div>
            <div class="pedal-value">
              <span id="throttlePercent">0</span>%
            </div>
            <div class="pedal-sub">HOLD &amp; DRAG</div>
          </div>
        </div>
      </div>
    </div>

    <div id="rotateOverlay" role="alert">
      <svg
        class="rotate-icon"
        width="64"
        height="64"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="8" width="18" height="8" rx="2" />
        <path d="M12 3a4 4 0 0 1 4 4" />
      </svg>
      <span>Hold your phone horizontally to use the controller.</span>
    </div>

    <div id="unsupportedMsg">
      Web Bluetooth is not available in this browser.<br />
      Please open this page in Google Chrome on Android.
    </div>

    <script>
      (function () {
        "use strict";

        // ---- UUIDs (must match ESP32 NimBLE firmware) ----
        const SERVICE_UUID = "6d5a0001-8b1f-4f2e-9c3d-1a2b3c4d5e6f";
        const THROTTLE_UUID = "6d5a0002-8b1f-4f2e-9c3d-1a2b3c4d5e6f";
        const BRAKE_UUID = "6d5a0003-8b1f-4f2e-9c3d-1a2b3c4d5e6f";
        const SPEED_UUID = "6d5a0004-8b1f-4f2e-9c3d-1a2b3c4d5e6f";
        const STEERING_UUID = "6d5a0005-8b1f-4f2e-9c3d-1a2b3c4d5e6f";

        const WRITE_INTERVAL_MS = 30;

        // ---- Speedometer config ----
        const MAX_SPEED = 200; // kph, needle and readout are camped to this
        const SPEED_NOTIFY_MS = 200; // how often the BLE device sends speed
        const GAUGE_START_ANGLE = 135; // deg, clockwise from 3 o'clock (lower-left, 0 kph)
        const GAUGE_SWEEP = 270; // deg, total sweep from 0 to MAX_SPEED
        const REDLINE_FROM = 170; // kph, start of the red zone near max

        // ---- DOM refs ----
        const connectBtn = document.getElementById("connectBtn");
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");
        const needleGroup = document.getElementById("needleGroup");
        const speedDigitalEl = document.getElementById("speedDigital");
        const gaugeTicksG = document.getElementById("gaugeTicks");
        const gaugeTrackPath = document.getElementById("gaugeTrack");
        const gaugeRedlinePath = document.getElementById("gaugeRedline");
        const brakePanel = document.getElementById("brakePanel");
        const throttlePanel = document.getElementById("throttlePanel");
        const steeringPanel = document.getElementById("steeringPanel");
        const telemThrottle = document.getElementById("telemThrottle");
        const telemBrake = document.getElementById("telemBrake");
        const telemSteering = document.getElementById("telemSteering");

        // ---- BLE state ----
        const state = {
          device: null,
          server: null,
          throttleChar: null,
          brakeChar: null,
          speedChar: null,
          steeringChar: null,
          connected: false,
        };

        function setStatus(connected, text) {
          state.connected = connected;
          statusDot.classList.toggle("connected", connected);
          statusText.textContent = text;
          connectBtn.textContent = connected
            ? "Disconnect"
            : "Connect SimulCar";
          connectBtn.classList.toggle("disconnect", connected);
          brakePanel.classList.toggle("disabled", !connected);
          throttlePanel.classList.toggle("disabled", !connected);
          steeringPanel.classList.toggle("disabled", !connected);
          if (!connected) {
            setSpeedImmediate(0);
            brakeCtl.forceZero();
            throttleCtl.forceZero();
            steeringCtl.forceZero();
          }
        }

        function onDisconnected() {
          state.server = null;
          state.throttleChar = null;
          state.brakeChar = null;
          state.speedChar = null;
          state.steeringChar = null;
          setStatus(false, "Disconnected");
        }

        async function connectBLE() {
          if (!navigator.bluetooth) {
            document.getElementById("unsupportedMsg").style.display = "flex";
            return;
          }
          const debugMode = document.getElementById("debugScan").checked;
          try {
            setStatus(false, "Requesting device...");
            const requestOptions = debugMode
              ? { acceptAllDevices: true, optionalServices: [SERVICE_UUID] }
              : {
                  filters: [{ namePrefix: "SimulCar" }],
                  optionalServices: [SERVICE_UUID],
                };

            const device =
              await navigator.bluetooth.requestDevice(requestOptions);
            state.device = device;
            device.addEventListener("gattserverdisconnected", onDisconnected);

            setStatus(
              false,
              "Connecting to " + (device.name || "device") + "...",
            );
            const server = await device.gatt.connect();
            state.server = server;

            let service;
            try {
              service = await server.getPrimaryService(SERVICE_UUID);
            } catch (svcErr) {
              console.error("Service lookup failed:", svcErr);
              setStatus(
                false,
                (device.name || "Device") +
                  " connected, but SimulCar service not found",
              );
              device.gatt.disconnect();
              return;
            }

            state.throttleChar = await service.getCharacteristic(THROTTLE_UUID);
            state.brakeChar = await service.getCharacteristic(BRAKE_UUID);
            state.speedChar = await service.getCharacteristic(SPEED_UUID);
            state.steeringChar =
              await service.getCharacteristic(STEERING_UUID);

            await state.speedChar.startNotifications();
            state.speedChar.addEventListener(
              "characteristicvaluechanged",
              onSpeedNotify,
            );

            setStatus(true, "Connected: " + (device.name || "SimulCar"));

            try {
              if (screen.orientation && screen.orientation.lock) {
                await screen.orientation.lock("landscape");
              }
            } catch (e) {
              /* orientation lock not critical */
            }
          } catch (err) {
            console.error("BLE connect error:", err);
            if (err && err.name === "NotFoundError") {
              setStatus(
                false,
                debugMode
                  ? "No devices found nearby"
                  : "No SimulCar device advertising the service",
              );
            } else {
              setStatus(
                false,
                "Connection failed: " +
                  (err && err.message ? err.message : "unknown error"),
              );
            }
          }
        }

        function disconnectBLE() {
          if (
            state.device &&
            state.device.gatt &&
            state.device.gatt.connected
          ) {
            state.device.gatt.disconnect();
          } else {
            onDisconnected();
          }
        }

        connectBtn.addEventListener("click", function () {
          if (state.connected) {
            disconnectBLE();
          } else {
            connectBLE();
          }
        });

        // ---- Analog speed gauge ----
        // The BLE device only notifies a new speed every ~SPEED_NOTIFY_MS,
        // so snapping the needle straight to each new value looks jerky.
        // Instead we keep a "displayed" speed that is continuously tweened
        // from wherever it currently is toward the latest target value over
        // SPEED_NOTIFY_MS, via requestAnimationFrame, so the needle sweeps
        // smoothly rather than jumping every time a notification arrives.
        function polarPoint(cx, cy, r, angleDeg) {
          const rad = (angleDeg * Math.PI) / 180;
          return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
        }

        function describeArc(cx, cy, r, startAngle, endAngle) {
          const start = polarPoint(cx, cy, r, startAngle);
          const end = polarPoint(cx, cy, r, endAngle);
          const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
          return (
            "M " +
            start.x +
            " " +
            start.y +
            " A " +
            r +
            " " +
            r +
            " 0 " +
            largeArc +
            " 1 " +
            end.x +
            " " +
            end.y
          );
        }

        function angleForSpeed(speed) {
          return GAUGE_START_ANGLE + (speed / MAX_SPEED) * GAUGE_SWEEP;
        }

        function buildGauge() {
          const cx = 100,
            cy = 100,
            r = 82;
          gaugeTrackPath.setAttribute(
            "d",
            describeArc(cx, cy, r, GAUGE_START_ANGLE, GAUGE_START_ANGLE + GAUGE_SWEEP),
          );
          gaugeRedlinePath.setAttribute(
            "d",
            describeArc(
              cx,
              cy,
              r,
              angleForSpeed(REDLINE_FROM),
              GAUGE_START_ANGLE + GAUGE_SWEEP,
            ),
          );

          const STEP = 20;
          for (let s = 0; s <= MAX_SPEED; s += STEP) {
            const angle = angleForSpeed(s);
            const major = s % 40 === 0;
            const outer = polarPoint(cx, cy, r, angle);
            const inner = polarPoint(cx, cy, major ? 67 : 73, angle);
            const tick = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "line",
            );
            tick.setAttribute("x1", outer.x);
            tick.setAttribute("y1", outer.y);
            tick.setAttribute("x2", inner.x);
            tick.setAttribute("y2", inner.y);
            tick.setAttribute("class", "gauge-tick" + (major ? " major" : ""));
            tick.setAttribute("stroke-width", major ? "2.5" : "1.5");
            gaugeTicksG.appendChild(tick);

            if (major) {
              const labelPos = polarPoint(cx, cy, 57, angle);
              const label = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text",
              );
              label.setAttribute("x", labelPos.x);
              label.setAttribute("y", labelPos.y + 3);
              label.setAttribute("class", "gauge-label");
              label.textContent = String(s);
              gaugeTicksG.appendChild(label);
            }
          }
        }
        buildGauge();

        let displayedSpeed = 0; // currently rendered (tweened) value
        let speedAnimFrom = 0;
        let speedAnimTo = 0;
        let speedAnimStart = 0;
        let speedRafId = null;

        function renderNeedle(speed) {
          // needle is drawn pointing at angle 270 (straight up) by default
          const angle = angleForSpeed(speed) - 270;
          needleGroup.setAttribute("transform", "rotate(" + angle + " 100 100)");
          speedDigitalEl.textContent = String(Math.round(speed));
        }

        function speedAnimStep(now) {
          const t = Math.min(1, (now - speedAnimStart) / SPEED_NOTIFY_MS);
          displayedSpeed = speedAnimFrom + (speedAnimTo - speedAnimFrom) * t;
          renderNeedle(displayedSpeed);
          if (t < 1) {
            speedRafId = requestAnimationFrame(speedAnimStep);
          } else {
            speedRafId = null;
          }
        }

        // Camps the target to 0..MAX_SPEED and smoothly eases the needle
        // toward it instead of setting it directly.
        function setSpeedTarget(newSpeed) {
          const clamped = Math.max(0, Math.min(MAX_SPEED, newSpeed));
          speedAnimFrom = displayedSpeed;
          speedAnimTo = clamped;
          speedAnimStart = performance.now();
          if (!speedRafId) {
            speedRafId = requestAnimationFrame(speedAnimStep);
          }
        }

        // Snaps the needle immediately (used on connect/disconnect), no tween.
        function setSpeedImmediate(newSpeed) {
          if (speedRafId) {
            cancelAnimationFrame(speedRafId);
            speedRafId = null;
          }
          const clamped = Math.max(0, Math.min(MAX_SPEED, newSpeed));
          displayedSpeed = clamped;
          speedAnimFrom = clamped;
          speedAnimTo = clamped;
          renderNeedle(clamped);
        }

        setSpeedImmediate(0);

        function onSpeedNotify(event) {
          const dv = event.target.value; // DataView
          if (!dv || dv.byteLength < 2) return;
          const speed = dv.getUint16(0, true); // little-endian uint16
          setSpeedTarget(speed); // camped to MAX_SPEED and tweened in, not set directly
        }

        // ---- Serialized write queue per characteristic ----
        function makeWriter(getChar) {
          let chain = Promise.resolve();
          return function write(value) {
            chain = chain
              .then(function () {
                const char = getChar();
                if (!char || !state.connected) return;
                const buf = new Uint8Array([value & 0xff]);
                if (char.writeValueWithoutResponse) {
                  return char
                    .writeValueWithoutResponse(buf)
                    .catch(function (e) {
                      console.warn(
                        "write (noresp) failed, retrying with writeValue",
                        e,
                      );
                      return char.writeValue(buf).catch(function (e2) {
                        console.error("write failed:", e2);
                      });
                    });
                }
                return char.writeValue(buf).catch(function (e) {
                  console.error("write failed:", e);
                });
              })
              .catch(function (e) {
                console.error(e);
              });
            return chain;
          };
        }

        const writeThrottle = makeWriter(function () {
          return state.throttleChar;
        });
        const writeBrake = makeWriter(function () {
          return state.brakeChar;
        });
        const writeSteering = makeWriter(function () {
          return state.steeringChar;
        });

        // ---- Multi-touch helper ----
        // touchmove/touchend events carry EVERY finger currently on the
        // screen in changedTouches/touches, not just the one that started
        // on a given element. Each control must track the identifier of
        // the touch it owns and look it up by id, otherwise two fingers
        // down at once (e.g. steering + braking) cross-talk and jump to
        // whichever finger moved last.
        function findTouchById(touchList, id) {
          for (let i = 0; i < touchList.length; i++) {
            if (touchList[i].identifier === id) return touchList[i];
          }
          return null;
        }

        // ---- Pedal controller factory ----
        function createPedal(opts) {
          const track = document.getElementById(opts.trackId);
          const fill = document.getElementById(opts.fillId);
          const percentEl = document.getElementById(opts.percentId);
          const telemEl = opts.telemEl;
          const writeFn = opts.writeFn;

          let dragging = false;
          let touchId = null; // identifier of the finger owned by this control
          let currentValue = 0; // live value from finger position
          let lastSentValue = -1;
          let intervalId = null;

          function render(value) {
            fill.style.height = value + "%";
            percentEl.textContent = value;
            if (telemEl) telemEl.textContent = value + "%";
          }

          function valueFromTouch(touch) {
            const rect = track.getBoundingClientRect();
            let pct = ((rect.bottom - touch.clientY) / rect.height) * 100;
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            return Math.round(pct);
          }

          function startLoop() {
            if (intervalId) return;
            intervalId = setInterval(function () {
              if (!state.connected) return;
              if (currentValue !== lastSentValue) {
                lastSentValue = currentValue;
                writeFn(currentValue);
              }
            }, WRITE_INTERVAL_MS);
          }

          function stopLoop() {
            if (intervalId) {
              clearInterval(intervalId);
              intervalId = null;
            }
          }

          function forceZero() {
            dragging = false;
            touchId = null;
            stopLoop();
            currentValue = 0;
            lastSentValue = 0;
            render(0);
            if (state.connected) {
              writeFn(0);
            }
          }

          function onTouchStart(e) {
            if (!state.connected) return;
            if (dragging) return; // this control already owns a finger
            e.preventDefault();
            const touch = e.changedTouches[0];
            touchId = touch.identifier;
            dragging = true;
            currentValue = valueFromTouch(touch);
            render(currentValue);
            startLoop();
          }

          function onTouchMove(e) {
            if (!dragging) return;
            const touch = findTouchById(e.changedTouches, touchId);
            if (!touch) return; // a different finger moved, not ours
            e.preventDefault();
            currentValue = valueFromTouch(touch);
            render(currentValue);
          }

          function onTouchEnd(e) {
            if (!dragging) return;
            const touch = findTouchById(e.changedTouches, touchId);
            if (!touch) return; // a different finger lifted, not ours
            e.preventDefault();
            forceZero();
          }

          track.addEventListener("touchstart", onTouchStart, {
            passive: false,
          });
          track.addEventListener("touchmove", onTouchMove, { passive: false });
          track.addEventListener("touchend", onTouchEnd, { passive: false });
          track.addEventListener("touchcancel", onTouchEnd, { passive: false });

          render(0);

          return { forceZero: forceZero };
        }

        // ---- Steering wheel controller factory ----
        // Rotary drag control: the whole circular track is the touch
        // surface. Dragging moves a finger around the center, which spins
        // the wheel graphic. Value range -100..100 maps to a +-135 degree
        // lock. Releasing animates the wheel back to center smoothly
        // rather than snapping, then stops sending once settled.
        function createSteering(opts) {
          const wheelWrap = document.getElementById(opts.trackId);
          const wheelGraphic = document.getElementById(opts.graphicId);
          const valueEl = document.getElementById(opts.valueId);
          const telemEl = opts.telemEl;
          const writeFn = opts.writeFn;

          const MAX_ANGLE = 135; // degrees of lock for -100..100
          const RETURN_MS = 350; // smooth return-to-center duration

          let dragging = false;
          let touchId = null; // identifier of the finger owned by this control
          let rotation = 0; // current wheel angle, -MAX_ANGLE..MAX_ANGLE
          let startAngle = 0;
          let startRotation = 0;
          let currentValue = 0;
          let lastSentValue = -1;
          let intervalId = null;
          let returnFrame = null;

          function clamp(v, min, max) {
            return Math.max(min, Math.min(max, v));
          }

          function angleFromTouch(touch, rect) {
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            return (
              (Math.atan2(touch.clientY - cy, touch.clientX - cx) * 180) /
              Math.PI
            );
          }

          function normalizeDelta(d) {
            while (d > 180) d -= 360;
            while (d < -180) d += 360;
            return d;
          }

          function render() {
            wheelGraphic.style.transform = "rotate(" + rotation + "deg)";
            valueEl.textContent = currentValue;
            if (telemEl) telemEl.textContent = currentValue + "%";
          }

          function setRotation(deg) {
            rotation = clamp(deg, -MAX_ANGLE, MAX_ANGLE);
            currentValue = Math.round((rotation / MAX_ANGLE) * 100);
            render();
          }

          function startLoop() {
            if (intervalId) return;
            intervalId = setInterval(function () {
              if (!state.connected) return;
              if (currentValue !== lastSentValue) {
                lastSentValue = currentValue;
                writeFn(currentValue);
              }
            }, WRITE_INTERVAL_MS);
          }

          function stopLoop() {
            if (intervalId) {
              clearInterval(intervalId);
              intervalId = null;
            }
          }

          function cancelReturnAnim() {
            if (returnFrame) {
              cancelAnimationFrame(returnFrame);
              returnFrame = null;
            }
          }

          function animateReturnToZero() {
            cancelReturnAnim();
            const startRot = rotation;
            const startTime = performance.now();
            function step(now) {
              const t = Math.min(1, (now - startTime) / RETURN_MS);
              const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
              setRotation(startRot * (1 - eased));
              if (t < 1) {
                returnFrame = requestAnimationFrame(step);
              } else {
                returnFrame = null;
                setRotation(0);
                stopLoop();
                lastSentValue = 0;
                if (state.connected) writeFn(0);
              }
            }
            returnFrame = requestAnimationFrame(step);
          }

          function forceZero() {
            dragging = false;
            touchId = null;
            cancelReturnAnim();
            stopLoop();
            rotation = 0;
            currentValue = 0;
            lastSentValue = 0;
            render();
            if (state.connected) {
              writeFn(0);
            }
          }

          function onTouchStart(e) {
            if (!state.connected) return;
            if (dragging) return; // this control already owns a finger
            e.preventDefault();
            cancelReturnAnim();
            const rect = wheelWrap.getBoundingClientRect();
            const touch = e.changedTouches[0];
            touchId = touch.identifier;
            dragging = true;
            startAngle = angleFromTouch(touch, rect);
            startRotation = rotation;
            startLoop();
          }

          function onTouchMove(e) {
            if (!dragging) return;
            const touch = findTouchById(e.changedTouches, touchId);
            if (!touch) return; // a different finger moved, not ours
            e.preventDefault();
            const rect = wheelWrap.getBoundingClientRect();
            const angle = angleFromTouch(touch, rect);
            const delta = normalizeDelta(angle - startAngle);
            setRotation(startRotation + delta);
          }

          function onTouchEnd(e) {
            if (!dragging) return;
            const touch = findTouchById(e.changedTouches, touchId);
            if (!touch) return; // a different finger lifted, not ours
            e.preventDefault();
            dragging = false;
            touchId = null;
            animateReturnToZero();
          }

          wheelWrap.addEventListener("touchstart", onTouchStart, {
            passive: false,
          });
          wheelWrap.addEventListener("touchmove", onTouchMove, {
            passive: false,
          });
          wheelWrap.addEventListener("touchend", onTouchEnd, {
            passive: false,
          });
          wheelWrap.addEventListener("touchcancel", onTouchEnd, {
            passive: false,
          });

          render();

          return { forceZero: forceZero };
        }

        const steeringCtl = createSteering({
          trackId: "steeringTrack",
          graphicId: "steeringWheelGraphic",
          valueId: "steeringPercent",
          telemEl: telemSteering,
          writeFn: writeSteering,
        });

        const brakeCtl = createPedal({
          trackId: "brakeTrack",
          fillId: "brakeFill",
          percentId: "brakePercent",
          telemEl: telemBrake,
          writeFn: writeBrake,
        });

        const throttleCtl = createPedal({
          trackId: "throttleTrack",
          fillId: "throttleFill",
          percentId: "throttlePercent",
          telemEl: telemThrottle,
          writeFn: writeThrottle,
        });

        // Safety: if the tab is hidden/backgrounded, zero both pedals
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            brakeCtl.forceZero();
            throttleCtl.forceZero();
            steeringCtl.forceZero();
          }
        });

        // ---- Portrait blocker ----
        // Pure CSS overlay (see #rotateOverlay): in portrait it covers the
        // whole app and there is no way to dismiss it. The only extra logic
        // is safety: zero both pedals when entering portrait, in case a
        // finger was mid-drag when the phone was turned.
        const orientationQuery = window.matchMedia("(orientation: portrait)");
        function onOrientationChange(e) {
          if (e.matches) {
            brakeCtl.forceZero();
            throttleCtl.forceZero();
            steeringCtl.forceZero();
          }
        }
        if (orientationQuery.addEventListener) {
          orientationQuery.addEventListener("change", onOrientationChange);
        } else if (orientationQuery.addListener) {
          orientationQuery.addListener(onOrientationChange);
        }

        if (!navigator.bluetooth) {
          document.getElementById("unsupportedMsg").style.display = "flex";
        }
      })();
    </script>
  </body>
</html>
