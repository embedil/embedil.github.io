<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>SimulCar BLE Controller</title>
    <style>
      :root {
        --bg: #0a0a0c;
        --panel: #121216;
        --border: #2a2a30;
        --text: #eaeaea;
        --muted: #8a8a92;
        --accent: #2ea8ff;
        --brake: #ff3b3b;
        --brake-dark: #5c1414;
        --throttle: #2ecc71;
        --throttle-dark: #114d2a;
        --danger: #ff3b3b;
        --ok: #2ecc71;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #app {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }

      /* TOP BAR */
      #topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        z-index: 10;
      }
      #topbar .title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--accent);
        white-space: nowrap;
        text-decoration: none;
        cursor: pointer;
        touch-action: manipulation;
      }
      #topbar .title:active {
        filter: brightness(0.75);
      }
      #topbar .title:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }
      #statusWrap {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      #statusDot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 6px var(--danger);
        flex: 0 0 auto;
      }
      #statusDot.connected {
        background: var(--ok);
        box-shadow: 0 0 6px var(--ok);
      }
      #connectBtn {
        background: var(--accent);
        color: #07131c;
        border: none;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 700;
        border-radius: 8px;
        cursor: pointer;
        touch-action: manipulation;
      }
      #connectBtn:active {
        filter: brightness(0.85);
      }
      #connectBtn.disconnect {
        background: var(--brake);
        color: #1a0505;
      }
      #connectBtn:disabled {
        background: #3a3a40;
        color: #888;
      }
      #debugToggleWrap {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        cursor: pointer;
      }
      /* Custom toggle switch (native checkbox hidden, keeps :checked state) */
      #debugToggleWrap input[type="checkbox"] {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }
      .toggle-track {
        position: relative;
        display: inline-block;
        flex: 0 0 auto;
        width: 34px;
        height: 18px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 9px;
        transition:
          background 0.2s ease,
          border-color 0.2s ease;
      }
      .toggle-track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--muted);
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }
      #debugToggleWrap input:checked + .toggle-track {
        background: var(--accent);
        border-color: var(--accent);
      }
      #debugToggleWrap input:checked + .toggle-track::after {
        background: #07131c;
        transform: translateX(16px);
      }
      #debugToggleWrap input:focus-visible + .toggle-track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* MAIN LAYOUT */
      #main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: row;
        min-height: 0;
        padding: 10px;
        gap: 10px;
      }

      /* PEDAL PANELS */
      .pedal-panel {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        min-width: 0;
      }
      .pedal-label-top {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .pedal-track {
        position: relative;
        flex: 1 1 auto;
        width: 64px;
        max-width: 22vw;
        min-width: 46px;
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        touch-action: none;
      }
      .pedal-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        border-radius: 0;
      }
      #brakeTrack .pedal-fill {
        background: linear-gradient(to top, var(--brake-dark), var(--brake));
      }
      #throttleTrack .pedal-fill {
        background: linear-gradient(
          to top,
          var(--throttle-dark),
          var(--throttle)
        );
      }
      .pedal-ticks {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 6px 0;
        pointer-events: none;
      }
      .pedal-ticks div {
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
        width: 100%;
      }
      .pedal-value {
        margin-top: 8px;
        font-size: 22px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        min-width: 3ch;
        text-align: center;
      }
      #brakePercent {
        color: var(--brake);
      }
      #throttlePercent {
        color: var(--throttle);
      }
      .pedal-sub {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 1px;
      }

      /* CENTER PANEL */
      #centerPanel {
        flex: 0 0 auto;
        width: 40%;
        max-width: 420px;
        min-width: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      #speedValue {
        font-size: min(20vw, 110px);
        font-weight: 800;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        text-shadow: 0 0 18px rgba(46, 168, 255, 0.35);
      }
      #speedUnit {
        font-size: 16px;
        letter-spacing: 4px;
        color: var(--muted);
        margin-top: 2px;
      }
      #telemetry {
        display: flex;
        gap: 18px;
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      #telemetry span b {
        display: block;
        font-size: 15px;
        color: var(--text);
      }

      .pedal-panel.disabled .pedal-track {
        opacity: 0.35;
      }

      /* PORTRAIT BLOCKER: full-screen overlay that hides the app until
         the phone is held horizontally. Cannot be dismissed. */
      #rotateOverlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--bg);
        color: var(--text);
        text-align: center;
        padding: 30px;
        font-size: 16px;
        line-height: 1.5;
      }
      #rotateOverlay .rotate-icon {
        color: var(--accent);
        animation: rotateHint 2.2s ease-in-out infinite;
      }
      @keyframes rotateHint {
        0%,
        20% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(90deg);
        }
      }
      @media (orientation: portrait) {
        #rotateOverlay {
          display: flex;
        }
      }

      #unsupportedMsg {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        color: #fff;
        z-index: 999;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <a class="title" href="/simulcar.html">SimulCar</a>
        <div id="statusWrap">
          <div id="statusDot"></div>
          <span id="statusText">Disconnected</span>
        </div>
        <label id="debugToggleWrap">
          <input type="checkbox" id="debugScan" />
          <span class="toggle-track"></span>
          <span>Show all devices</span>
        </label>
        <button id="connectBtn">Connect SimulCar</button>
      </div>

      <div id="main">
        <!-- BRAKE (LEFT) -->
        <div class="pedal-panel disabled" id="brakePanel">
          <div class="pedal-label-top">BRAKE</div>
          <div class="pedal-track" id="brakeTrack">
            <div class="pedal-ticks">
              <div></div>
              <div></div>
              <div></div>
              <div></div>
              <div></div>
            </div>
            <div class="pedal-fill" id="brakeFill"></div>
          </div>
          <div class="pedal-value"><span id="brakePercent">0</span>%</div>
          <div class="pedal-sub">HOLD &amp; DRAG</div>
        </div>

        <!-- CENTER -->
        <div id="centerPanel">
          <div id="speedValue">0</div>
          <div id="speedUnit">KM/H</div>
          <div id="telemetry">
            <span>THR<b id="telemThrottle">0%</b></span>
            <span>BRK<b id="telemBrake">0%</b></span>
          </div>
        </div>

        <!-- THROTTLE (RIGHT) -->
        <div class="pedal-panel disabled" id="throttlePanel">
          <div class="pedal-label-top">THROTTLE</div>
          <div class="pedal-track" id="throttleTrack">
            <div class="pedal-ticks">
              <div></div>
              <div></div>
              <div></div>
              <div></div>
              <div></div>
            </div>
            <div class="pedal-fill" id="throttleFill"></div>
          </div>
          <div class="pedal-value"><span id="throttlePercent">0</span>%</div>
          <div class="pedal-sub">HOLD &amp; DRAG</div>
        </div>
      </div>
    </div>

    <div id="rotateOverlay" role="alert">
      <svg
        class="rotate-icon"
        width="64"
        height="64"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="8" width="18" height="8" rx="2" />
        <path d="M12 3a4 4 0 0 1 4 4" />
      </svg>
      <span>Hold your phone horizontally to use the controller.</span>
    </div>

    <div id="unsupportedMsg">
      Web Bluetooth is not available in this browser.<br />
      Please open this page in Google Chrome on Android.
    </div>

    <script>
      (function () {
        "use strict";

        // ---- UUIDs (must match ESP32 NimBLE firmware) ----
        const SERVICE_UUID = "6d5a0001-8b1f-4f2e-9c3d-1a2b3c4d5e6f";
        const THROTTLE_UUID = "6d5a0002-8b1f-4f2e-9c3d-1a2b3c4d5e6f";
        const BRAKE_UUID = "6d5a0003-8b1f-4f2e-9c3d-1a2b3c4d5e6f";
        const SPEED_UUID = "6d5a0004-8b1f-4f2e-9c3d-1a2b3c4d5e6f";

        const WRITE_INTERVAL_MS = 30;

        // ---- DOM refs ----
        const connectBtn = document.getElementById("connectBtn");
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");
        const speedValueEl = document.getElementById("speedValue");
        const brakePanel = document.getElementById("brakePanel");
        const throttlePanel = document.getElementById("throttlePanel");
        const telemThrottle = document.getElementById("telemThrottle");
        const telemBrake = document.getElementById("telemBrake");

        // ---- BLE state ----
        const state = {
          device: null,
          server: null,
          throttleChar: null,
          brakeChar: null,
          speedChar: null,
          connected: false,
        };

        function setStatus(connected, text) {
          state.connected = connected;
          statusDot.classList.toggle("connected", connected);
          statusText.textContent = text;
          connectBtn.textContent = connected
            ? "Disconnect"
            : "Connect SimulCar";
          connectBtn.classList.toggle("disconnect", connected);
          brakePanel.classList.toggle("disabled", !connected);
          throttlePanel.classList.toggle("disabled", !connected);
          if (!connected) {
            speedValueEl.textContent = "0";
            brakeCtl.forceZero();
            throttleCtl.forceZero();
          }
        }

        function onDisconnected() {
          state.server = null;
          state.throttleChar = null;
          state.brakeChar = null;
          state.speedChar = null;
          setStatus(false, "Disconnected");
        }

        async function connectBLE() {
          if (!navigator.bluetooth) {
            document.getElementById("unsupportedMsg").style.display = "flex";
            return;
          }
          const debugMode = document.getElementById("debugScan").checked;
          try {
            setStatus(false, "Requesting device...");
            const requestOptions = debugMode
              ? { acceptAllDevices: true, optionalServices: [SERVICE_UUID] }
              : {
                  filters: [{ namePrefix: "SimulCar" }],
                  optionalServices: [SERVICE_UUID],
                };

            const device =
              await navigator.bluetooth.requestDevice(requestOptions);
            state.device = device;
            device.addEventListener("gattserverdisconnected", onDisconnected);

            setStatus(
              false,
              "Connecting to " + (device.name || "device") + "...",
            );
            const server = await device.gatt.connect();
            state.server = server;

            let service;
            try {
              service = await server.getPrimaryService(SERVICE_UUID);
            } catch (svcErr) {
              console.error("Service lookup failed:", svcErr);
              setStatus(
                false,
                (device.name || "Device") +
                  " connected, but SimulCar service not found",
              );
              device.gatt.disconnect();
              return;
            }

            state.throttleChar = await service.getCharacteristic(THROTTLE_UUID);
            state.brakeChar = await service.getCharacteristic(BRAKE_UUID);
            state.speedChar = await service.getCharacteristic(SPEED_UUID);

            await state.speedChar.startNotifications();
            state.speedChar.addEventListener(
              "characteristicvaluechanged",
              onSpeedNotify,
            );

            setStatus(true, "Connected: " + (device.name || "SimulCar"));

            try {
              if (screen.orientation && screen.orientation.lock) {
                await screen.orientation.lock("landscape");
              }
            } catch (e) {
              /* orientation lock not critical */
            }
          } catch (err) {
            console.error("BLE connect error:", err);
            if (err && err.name === "NotFoundError") {
              setStatus(
                false,
                debugMode
                  ? "No devices found nearby"
                  : "No SimulCar device advertising the service",
              );
            } else {
              setStatus(
                false,
                "Connection failed: " +
                  (err && err.message ? err.message : "unknown error"),
              );
            }
          }
        }

        function disconnectBLE() {
          if (
            state.device &&
            state.device.gatt &&
            state.device.gatt.connected
          ) {
            state.device.gatt.disconnect();
          } else {
            onDisconnected();
          }
        }

        connectBtn.addEventListener("click", function () {
          if (state.connected) {
            disconnectBLE();
          } else {
            connectBLE();
          }
        });

        function onSpeedNotify(event) {
          const dv = event.target.value; // DataView
          if (!dv || dv.byteLength < 2) return;
          const speed = dv.getUint16(0, true); // little-endian uint16
          speedValueEl.textContent = String(speed);
        }

        // ---- Serialized write queue per characteristic ----
        function makeWriter(getChar) {
          let chain = Promise.resolve();
          return function write(value) {
            chain = chain
              .then(function () {
                const char = getChar();
                if (!char || !state.connected) return;
                const buf = new Uint8Array([value & 0xff]);
                if (char.writeValueWithoutResponse) {
                  return char
                    .writeValueWithoutResponse(buf)
                    .catch(function (e) {
                      console.warn(
                        "write (noresp) failed, retrying with writeValue",
                        e,
                      );
                      return char.writeValue(buf).catch(function (e2) {
                        console.error("write failed:", e2);
                      });
                    });
                }
                return char.writeValue(buf).catch(function (e) {
                  console.error("write failed:", e);
                });
              })
              .catch(function (e) {
                console.error(e);
              });
            return chain;
          };
        }

        const writeThrottle = makeWriter(function () {
          return state.throttleChar;
        });
        const writeBrake = makeWriter(function () {
          return state.brakeChar;
        });

        // ---- Pedal controller factory ----
        function createPedal(opts) {
          const track = document.getElementById(opts.trackId);
          const fill = document.getElementById(opts.fillId);
          const percentEl = document.getElementById(opts.percentId);
          const telemEl = opts.telemEl;
          const writeFn = opts.writeFn;

          let dragging = false;
          let currentValue = 0; // live value from finger position
          let lastSentValue = -1;
          let intervalId = null;

          function render(value) {
            fill.style.height = value + "%";
            percentEl.textContent = value;
            if (telemEl) telemEl.textContent = value + "%";
          }

          function valueFromTouch(touch) {
            const rect = track.getBoundingClientRect();
            let pct = ((rect.bottom - touch.clientY) / rect.height) * 100;
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            return Math.round(pct);
          }

          function startLoop() {
            if (intervalId) return;
            intervalId = setInterval(function () {
              if (!state.connected) return;
              if (currentValue !== lastSentValue) {
                lastSentValue = currentValue;
                writeFn(currentValue);
              }
            }, WRITE_INTERVAL_MS);
          }

          function stopLoop() {
            if (intervalId) {
              clearInterval(intervalId);
              intervalId = null;
            }
          }

          function forceZero() {
            dragging = false;
            stopLoop();
            currentValue = 0;
            lastSentValue = 0;
            render(0);
            if (state.connected) {
              writeFn(0);
            }
          }

          function onTouchStart(e) {
            if (!state.connected) return;
            e.preventDefault();
            dragging = true;
            const touch = e.changedTouches[0];
            currentValue = valueFromTouch(touch);
            render(currentValue);
            startLoop();
          }

          function onTouchMove(e) {
            if (!dragging) return;
            e.preventDefault();
            const touch = e.changedTouches[0];
            currentValue = valueFromTouch(touch);
            render(currentValue);
          }

          function onTouchEnd(e) {
            if (!dragging) return;
            e.preventDefault();
            forceZero();
          }

          track.addEventListener("touchstart", onTouchStart, {
            passive: false,
          });
          track.addEventListener("touchmove", onTouchMove, { passive: false });
          track.addEventListener("touchend", onTouchEnd, { passive: false });
          track.addEventListener("touchcancel", onTouchEnd, { passive: false });

          render(0);

          return { forceZero: forceZero };
        }

        const brakeCtl = createPedal({
          trackId: "brakeTrack",
          fillId: "brakeFill",
          percentId: "brakePercent",
          telemEl: telemBrake,
          writeFn: writeBrake,
        });

        const throttleCtl = createPedal({
          trackId: "throttleTrack",
          fillId: "throttleFill",
          percentId: "throttlePercent",
          telemEl: telemThrottle,
          writeFn: writeThrottle,
        });

        // Safety: if the tab is hidden/backgrounded, zero both pedals
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            brakeCtl.forceZero();
            throttleCtl.forceZero();
          }
        });

        // ---- Portrait blocker ----
        // Pure CSS overlay (see #rotateOverlay): in portrait it covers the
        // whole app and there is no way to dismiss it. The only extra logic
        // is safety: zero both pedals when entering portrait, in case a
        // finger was mid-drag when the phone was turned.
        const orientationQuery = window.matchMedia("(orientation: portrait)");
        function onOrientationChange(e) {
          if (e.matches) {
            brakeCtl.forceZero();
            throttleCtl.forceZero();
          }
        }
        if (orientationQuery.addEventListener) {
          orientationQuery.addEventListener("change", onOrientationChange);
        } else if (orientationQuery.addListener) {
          orientationQuery.addListener(onOrientationChange);
        }

        if (!navigator.bluetooth) {
          document.getElementById("unsupportedMsg").style.display = "flex";
        }
      })();
    </script>
  </body>
</html>
